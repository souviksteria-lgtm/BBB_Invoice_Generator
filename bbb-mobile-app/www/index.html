<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <title>BBB Invoice Generator - Mobile</title>
    <style>
      body { 
        margin: 0; 
        padding: 0; 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>BBB Invoice Generator - Mobile App</h1>
      <p>This is a placeholder for the mobile app version.</p>
      <p>Copy the HTML files from the parent directory to this location.</p>
      
      <h2>Files to copy:</h2>
      <ul>
        <li>index.html (rename to invoice.html)</li>
        <li>myorder.html</li>
        <li>catalogue.json</li>
        <li>signature.png</li>
      </ul>
    </div>

    <!-- Cordova is pre-loaded with every app -->
    <script src="cordova.js"></script>
    <script>
      document.addEventListener('deviceready', onDeviceReady, false);
      function onDeviceReady() {
        console.log('Device is ready');
      }
    </script>
  </body>
</html>
